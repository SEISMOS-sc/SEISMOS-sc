[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: needs real model weights
    network: needs network access
# Default run stays offline and weight-free. Drop -m to include the rest.
addopts = -m "not network and not slow" --strict-markers -q
filterwarnings =
    ignore::DeprecationWarning:importlib._bootstrap
