# Transfer of k = 2.5 across encoders, 480-token cap for all chunkers.
name: beir_encoder_transfer
benchmark: beir
subsets: [nfcorpus, scifact, arguana, fiqa, trec-covid]
dataset_args:
  data_dir: data/beir
encoders: [bge, e5, gte]
levels: [doc]
bm25: true
methods:
  - {method: whole}
  - {method: fixed, max_tokens: 480}
  - {method: seismos, k: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5], max_tokens: 480}
