# k sensitivity on the BEIR development sets.
name: beir_k_sweep
benchmark: beir
subsets: [arguana, fiqa, nfcorpus, scifact]
dataset_args:
  data_dir: data/beir
encoders: [bge]
encoder_args:
  query_prefix: ""
levels: [doc]
methods:
  - {method: seismos, k: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0], max_tokens: null}
